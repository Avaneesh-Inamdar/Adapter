name: Native macOS differential reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  libc-reference:
    runs-on: macos-15-intel
    timeout-minutes: 10
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved 2026-10-22
        with:
          persist-credentials: false
      - name: Build the Intel Mach-O without executing it
        run: python3 tools/differential.py build --output reference-bundle --count 4096
      - name: Capture native Darwin results
        run: python3 tools/differential.py capture --bundle reference-bundle --output reference-bundle/reference.json
      - name: Upload the exact executable, manifest, source and capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-reference-${{ github.sha }}
          path: reference-bundle/
          if-no-files-found: error
          retention-days: 14
