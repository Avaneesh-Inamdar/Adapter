name: Native macOS differential reference

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference:
    runs-on: macos-15-intel
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: adapter-libc-v1
            count: 4096
          - suite: adapter-objc-v1
            count: 4096
          - suite: adapter-thread-v1
            count: 1024
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved 2026-10-22
        with:
          persist-credentials: false
      - name: Build the Intel Mach-O without executing it
        run: python3 tools/differential.py build --suite ${{ matrix.suite }} --count ${{ matrix.count }} --output reference-bundle
      - name: Capture native Darwin results
        run: python3 tools/differential.py capture --bundle reference-bundle --output reference-bundle/reference.json --timeout 120
      - name: Upload the exact executable, manifest, source and capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-reference-${{ matrix.suite }}-${{ github.sha }}
          path: reference-bundle/
          if-no-files-found: error
          retention-days: 14

  cli-reference:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - name: Check out the workflow commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, resolved 2026-10-22
        with:
          persist-credentials: false
      - name: Fetch the pinned jq and ripgrep releases without executing them yet
        run: |
          python3 tools/fetch_jq.py
          python3 tools/fetch_ripgrep.py
      - name: Capture native jq and ripgrep results
        run: python3 tools/cli_differential.py capture --output cli-reference.json --timeout 60
      - name: Upload the corpus, capture and provenance
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mac-cli-reference-${{ github.sha }}
          path: |
            cli-reference.json
            tests/differential/cli_cases.json
            tests/fixtures/generated/reference/provenance.json
            tests/fixtures/generated/reference/provenance-ripgrep.json
          if-no-files-found: error
          retention-days: 14
