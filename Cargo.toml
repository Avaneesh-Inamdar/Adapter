[package]
name = "adapter"
version = "0.1.0"
edition = "2024"
description = "Experimental Windows-native Mach-O compatibility runtime"
license = "MIT"

[lib]
path = "src/lib.rs"

[[bin]]
name = "adapter-inspect"
path = "src/inspect/main.rs"

[[bin]]
name = "adapter-run"
path = "src/runtime/main.rs"

[dependencies]
object = { version = "=0.40.0", default-features = false, features = ["read", "std", "macho"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.10"

[[test]]
name = "macho"
path = "tests/unit/macho.rs"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_Debug"] }
